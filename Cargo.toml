[package]
name = "gsc-fq"
version = "0.7.0"
edition = "2021"
authors = ["putao520 <yuyao1022@hotmail.com>"]
description = "High-performance TCP proxy with enterprise-grade encryption, TOKEN authentication, CPU hardware acceleration, and reverse proxy capabilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/putao520/gsc-fq"
homepage = "https://github.com/putao520/gsc-fq"
documentation = "https://docs.rs/gsc-fq"
keywords = ["proxy", "tcp", "forwarding", "cli", "blackhole"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
# 寮傛杩愯鏃?
tokio = { version = "1.40", features = ["full"] }

# 閰嶇疆鏂囦欢瑙ｆ瀽
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# 閿欒澶勭悊
thiserror = "1.0"
anyhow = "1.0"

# 鏃ュ織绯荤粺
env_logger = "0.11"

# 缃戠粶鍜岀郴缁熻皟鐢?
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.29", features = ["socket", "net", "uio", "zerocopy"] }


# 并发工具
tokio-util = { version = "0.7", features = ["codec", "io", "compat"] }
yamux = "0.10"
futures = "0.3"

# 楂樻€ц兘瀛楄妭缂撳啿鍖?
bytes = "1.5"

# 绯荤粺淇℃伅
num_cpus = "1.16"

# UUID鐢熸垚
uuid = { version = "1.0", features = ["v4"] }

# 随机数生成（连接选择）
rand = "0.8"

# 二进制序列化（反向代理协议）
bincode = "1.3"
serde_json = "1.0.145"
sha2 = "0.10.9"
hex = "0.4.3"
aes-gcm-siv = "0.11.1"
ring = "0.17.14"
x25519-dalek = "2.0.1"
blake3 = "1.8.2"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2.0"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"
criterion = { version = "0.5", features = ["html_reports"] }
scopeguard = "1.2"
rand = "0.8"

# Removed references to deleted test files
# Integration tests are now in: tests/real_e2e_integration_test.rs, tests/simple_e2e_test.rs

[[bin]]
name = "gsc-fq"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true
