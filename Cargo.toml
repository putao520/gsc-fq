[package]
name = "gsc-fq"
version = "0.9.3"
edition = "2021"
authors = ["putao520 <yuyao1022@hotmail.com>"]
description = "High-performance TCP proxy with enterprise-grade encryption, TOKEN authentication, CPU hardware acceleration, and reverse proxy capabilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/putao520/gsc-fq"
homepage = "https://github.com/putao520/gsc-fq"
documentation = "https://docs.rs/gsc-fq"
keywords = ["proxy", "tcp", "forwarding", "cli", "network"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"
build = "build.rs"

[dependencies]
# 加密
aes-gcm-siv = "0.11"
blake3 = "1.8"
ring = "0.17.14"
sha2 = "0.10"
x25519-dalek = "2.0"

# 序列化
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
data-encoding = "2.7"
qrcode = "0.14"

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# 日志
env_logger = "0.11.8"

# 异步运行时
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec", "io", "compat"] }
futures = "0.3"

# TLS
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2"

# 网络和系统
socket2 = { version = "0.6.1", features = ["all"] }
libc = "0.2"  # Linux 系统调用（splice、pipe、fcntl 等）
nix = { version = "0.30", features = ["socket", "net", "uio", "zerocopy"] }

# 多路复用
yamux = "0.13.10"

# 工具库
bytes = "1.11"
hex = "0.4"
num_cpus = "1.17"
rand = "0.9"
uuid = { version = "1.19", features = ["v4", "serde"] }

# Cross-compilation targets for ARM architectures
[target.arm-unknown-linux-musleabihf]
linker = "arm-linux-gnueabihf-gcc"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.24"
criterion = { version = "0.8", features = ["html_reports"] }
scopeguard = "1.2"
rand = "0.9"

[[bin]]
name = "gsc-fq"
path = "src/main.rs"

[[bench]]
name = "zero_copy_comparison"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug-assertions = false
overflow-checks = false

# ARMv7 specific profile optimizations
[target.arm-unknown-linux-musleabihf.profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"  # Size optimization for embedded ARM devices
strip = true
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true
