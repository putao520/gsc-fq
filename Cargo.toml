[package]
name = "gsc-fq"
version = "0.3.0"
edition = "2021"
authors = ["Claude Code AI <noreply@anthropic.com>"]
description = "高性能数据流代理转发CLI工具，支持TOML配置和智能调试"
license = "MIT OR Apache-2.0"
repository = "https://github.com/putao520/gsc-fq"
homepage = "https://github.com/putao520/gsc-fq"
documentation = "https://docs.rs/gsc-fq"
keywords = ["proxy", "tcp", "forwarding", "cli", "network"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 配置文件解析
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志系统
env_logger = "0.11"

# 网络和系统调用
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.29", features = ["socket", "net", "uio", "zerocopy"] }


# 并发工具
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# 系统信息
num_cpus = "1.16"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"
criterion = { version = "0.5", features = ["html_reports"] }
scopeguard = "1.2"
rand = "0.8"

# Removed references to deleted test files
# Integration tests are now in: tests/real_e2e_integration_test.rs, tests/simple_e2e_test.rs

[[bin]]
name = "gsc-fq"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true