# Test configuration using public internet services
# This eliminates the need for local echo servers

[server]
bind_ip = "127.0.0.1"
debug = true

# Basic HTTP test - example.com (always available, returns simple HTML)
[[proxies]]
local_port = 8080
remote_host = "example.com"
remote_port = 80

# Large data test - speedtest.tele2.net (provides test files)
[[proxies]]
local_port = 8081
remote_host = "speedtest.tele2.net"
remote_port = 80

# DNS test - Google DNS (for non-HTTP protocol testing)
[[proxies]]
local_port = 8082
remote_host = "8.8.8.8"
remote_port = 53

# HTTP API test - httpbin.org (provides various endpoints)
[[proxies]]
local_port = 8083
remote_host = "httpbin.org"
remote_port = 80

# Alternative HTTP test - wikipedia.org
[[proxies]]
local_port = 8084
remote_host = "www.wikipedia.org"
remote_port = 80